[package]
name = "cadaclysm-sdk"
version = "0.14.0"
edition = "2021"
rust-version = "1.70"
description = "Read CAD files (STEP, IGES, IFC, Rhino 3dm, ACIS SAT, OCCT BREP, OpenSCAD) and build exact B-rep solids, over the prebuilt cadaclysm libraries loaded at run time."
# The wrapper's own source, like every wrapper in the SDK; the libraries it loads are
# proprietary, downloaded from the SDK's releases.
license = "Apache-2.0"
repository = "https://github.com/rdeioris/cadaclysm-sdk"
homepage = "https://cadaclysm.blitter.studio"
documentation = "https://cadaclysm.blitter.studio/docs/rust.html"
readme = "README.md"
keywords = ["cad", "step", "ifc", "brep", "mesh"]
categories = ["api-bindings", "graphics", "science"]
# What a crate needs and nothing else: the smoke and tree examples ride along as
# documentation, the repository's own tests stay behind.
include = ["src/**/*.rs", "js/*.js", "examples/*.rs", "build.rs", "README.md", "Cargo.toml"]

[lib]
name = "cadaclysm_sdk"

[features]
# Fetch this platform's libraries for this version from the SDK's release when the
# crate is built (build.rs), so nothing needs installing by hand. Off with
# `default-features = false`, or CADACLYSM_NO_DOWNLOAD=1 in the build's environment.
default = ["download"]
download = []
# `view::RawWindow::of`/`from_handles`: a winit, egui or other host's window, through the
# `raw-window-handle` 0.6 traits, for `View::in_window`.
raw-window-handle = ["dep:raw-window-handle"]

[dependencies]
# Optional, for the feature above; no C toolchain either.
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The one dependency always built off the web: the library is opened when the program
# runs, the way Python's ctypes and Node's koffi open it, so nothing here links against it
# and nothing needs a C toolchain or an import library to build. (build.rs only
# downloads; it compiles and links nothing.)
libloading = "0.8"

# In the browser (wasm32) the kernel is the web package's, called through its exports
# (src/web): nothing is downloaded or loaded from a file.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
wasm-bindgen-futures = "0.4.50"
# The canvas, worker and URL types View::on_canvas and the worker helper take.
web-sys = { version = "0.3.77", features = [
    "console",
    "DedicatedWorkerGlobalScope",
    "EventTarget",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "Url",
    "Worker",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.50"

# Standalone on purpose. This crate must build with nothing of cadaclysm but the
# shared library it loads, exactly as it does for a customer who has only the SDK
# zip, so it is not a member of the repository's workspace and must never grow a
# path dependency on one of its crates.
[workspace]
